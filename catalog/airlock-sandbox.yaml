# Sample Hermes plugin-catalog entry for airlock-sandbox.
# Copy to NousResearch/hermes-agent plugin-catalog/ after you publish a pin.
# Replace REPLACE_WITH_40_CHAR_COMMIT_SHA with the full commit SHA you submit.
name: airlock-sandbox
title: Airlock Sandbox
repo: https://github.com/justrunme/hermes-airlock-plugin
sha: REPLACE_WITH_40_CHAR_COMMIT_SHA
subdir: ""
description: >-
  Terminal backend that routes Hermes command execution through an external Airlock
  policy engine and disposable Docker sandbox, then surfaces verifiable receipts
  (RFC 8785 JCS, SHA-256, Ed25519, prev_hash chain) with BLOCKED / ALLOWED / VERIFIED
  status (`hermes config set terminal.backend airlock_sandbox`). Disclosure — network
  calls to the configured Airlock HTTPS base URL (`/healthz`, `/api/pubkey`,
  `/api/arena`, `/api/receipt/{id}`); optional secret `AIRLOCK_API_TOKEN` via Hermes
  secret scope; no host shell of its own (commands run only inside Airlock when
  policy allows). Hermes dangerous-command approvals are not bypassed.
maintainer: justrunme
tier: community
category: tools
requires_hermes: ">=0.21.6"
version: "0.1.0"
docs_url: https://github.com/justrunme/hermes-airlock-plugin
platforms:
  - linux
  - macos
  - windows
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
