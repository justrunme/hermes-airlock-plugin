name: airlock-sandbox
label: Airlock Sandbox
manifest_version: 2
kind: backend
version: 0.1.2
author: Andrey Lesnikov
license: MIT
homepage: https://github.com/justrunme/hermes-airlock-plugin
description: >
  Terminal backend that routes Hermes command execution through an external
  Airlock policy engine and disposable Docker sandbox, then surfaces
  verifiable receipts (RFC 8785 JCS, SHA-256, Ed25519) with
  BLOCKED / ALLOWED / VERIFIED status. Select with
  `hermes config set terminal.backend airlock_sandbox`.
  Requires an explicit HTTPS base_url. When verify_receipts is true (default),
  also requires a locally configured public_key_hex obtained out-of-band.
requires_hermes: ">=0.21.6"
platforms: [linux, macos, windows]
tags: [terminal, sandbox, airlock, receipts, policy, ed25519]
provides_tools: []
provides_hooks: []
provides_middleware: []
capabilities: []
python_dependencies:
  - "httpx>=0.27,<1"
  - "cryptography>=42,<51"
  - "jcs>=0.2.1,<1"
config_schema:
  base_url:
    type: str
    default: ""
    required: true
    label: Airlock base URL
    description: >
      Required HTTPS base URL of your Airlock HTTP API (no trailing slash).
      There is no built-in default host; set this explicitly before use.
  timeout_s:
    type: int
    default: 60
    label: Request timeout (seconds)
    description: "HTTP timeout for Airlock arena and receipt calls."
  verify_receipts:
    type: bool
    default: true
    label: Verify receipts
    description: >
      Fail closed when a receipt hash or Ed25519 signature does not verify.
      When true, public_key_hex must be set locally (never fetched from the server).
  public_key_hex:
    type: str
    default: ""
    required: false
    label: Airlock public key (hex)
    description: >
      Ed25519 public key (64 lowercase hex chars) obtained out-of-band from an
      operator you trust. Required at runtime when verify_receipts is true (the
      default); unused for trust when verify_receipts is false. Never fetched
      from the Airlock API at verify time.
  language:
    type: str
    choices: [bash, python]
    default: bash
    label: Arena language
    description: "Language field sent to Airlock /api/arena for terminal commands."
  api_token:
    type: secret
    env: AIRLOCK_API_TOKEN
    required: false
    label: Airlock API token
    description: "Optional bearer token for a private Airlock instance."
