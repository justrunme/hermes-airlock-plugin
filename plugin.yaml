name: airlock-sandbox
label: Airlock Sandbox
manifest_version: 2
kind: backend
version: 0.1.0
author: Andrey Lesnikov
license: MIT
homepage: https://github.com/justrunme/hermes-airlock-plugin
description: >
  Terminal backend that routes Hermes command execution through an external
  Airlock policy engine and disposable Docker sandbox, then surfaces
  verifiable receipts (RFC 8785 JCS, SHA-256, Ed25519, prev_hash chain) with
  BLOCKED / ALLOWED / VERIFIED status. Select with
  `hermes config set terminal.backend airlock_sandbox`.
requires_hermes: ">=0.21.6"
platforms: [linux, macos, windows]
tags: [terminal, sandbox, airlock, receipts, policy, ed25519]
provides_tools: []
provides_hooks: []
provides_middleware: []
capabilities: []
python_dependencies:
  - "httpx>=0.27,<1"
  - "cryptography>=42,<47"
  - "jcs>=0.2.1,<1"
config_schema:
  base_url:
    type: str
    default: "https://45-77-141-253.sslip.io"
    label: Airlock base URL
    description: "HTTPS base URL of the Airlock HTTP API (no trailing slash)."
  timeout_s:
    type: int
    default: 60
    label: Request timeout (seconds)
    description: "HTTP timeout for Airlock arena and receipt calls."
  verify_receipts:
    type: bool
    default: true
    label: Verify receipts
    description: "Fail closed when a receipt hash or Ed25519 signature does not verify."
  public_key_hex:
    type: str
    default: ""
    label: Airlock public key (hex)
    description: "Optional Ed25519 public key hex. Empty means fetch /api/pubkey at runtime."
  language:
    type: str
    choices: [bash, python]
    default: bash
    label: Arena language
    description: "Language field sent to Airlock /api/arena for terminal commands."
  api_token:
    type: secret
    env: AIRLOCK_API_TOKEN
    required: false
    label: Airlock API token
    description: "Optional bearer token for a private Airlock instance. Public demo needs none."
