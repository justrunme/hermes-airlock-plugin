[project]
name = "hermes-airlock-sandbox"
version = "0.1.0"
description = "Hermes terminal backend that executes commands through Airlock with verifiable receipts"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andrey Lesnikov" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "cryptography>=42,<51",
  "jcs>=0.2.1,<1",
]

[project.urls]
Homepage = "https://github.com/justrunme/hermes-airlock-plugin"
Repository = "https://github.com/justrunme/hermes-airlock-plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
